<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Track Your Shipment | Apex Global Logistics</title>
  
  <!-- Fonts: Plus Jakarta Sans for UI, JetBrains Mono for Tracking IDs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons (Lightweight, clean line icons) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* ==========================================================================
       TRACKSPHERE BRAND KIT & CSS VARIABLES
       ========================================================================== */
    :root {
      /* Colors */
      --color-bg: #F3F4F6; /* Soft Slate */
      --color-surface: #FFFFFF; /* Cloud White */
      --color-primary: #1E293B; /* Deep Navy */
      --color-primary-dark: #0F172A;
      --color-accent: #FF6B00; /* Action Orange */
      --color-accent-hover: #E66000;
      --color-text-main: #111827;
      --color-text-muted: #6B7280;
      --color-border: #E5E7EB;
      --color-error: #EF4444;
      
      /* Typography */
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Radii (Extreme Rounding) */
      --radius-card: 24px;
      --radius-pill: 999px;
      
      /* Shadows */
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-lg: 0 12px 24px -4px rgba(30, 41, 59, 0.08);
      --shadow-focus: 0 0 0 4px rgba(255, 107, 0, 0.15);
      
      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle background graphic to give a "Global/Spatial" feel */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60vh;
      background: radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: -1;
    }

    /* ==========================================================================
       LAYOUT & COMPONENTS
       ========================================================================== */
    .site-header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Tenant Logo Styling (e.g., Apex Global) */
    .tenant-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--color-primary);
      font-weight: 700;
      font-size: 1.125rem;
    }

    .tenant-brand-icon {
      width: 36px;
      height: 36px;
      background-color: var(--color-primary);
      color: var(--color-surface);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-actions a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      transition: color var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions a:hover {
      color: var(--color-primary);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      margin-top: -5vh; /* Slight optical lift */
    }

    .hero-text {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-primary-dark);
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--color-text-muted);
      font-weight: 400;
    }

    /* Tracking Search Bar (Extreme Rounding & Deep Navy/Orange focus) */
    .search-wrapper {
      width: 100%;
      background: var(--color-surface);
      border-radius: var(--radius-pill);
      padding: 8px;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid transparent;
      transition: all var(--transition-fast);
      position: relative;
    }

    /* Focus-within allows us to style the wrapper when the input is focused */
    .search-wrapper:focus-within {
      border-color: rgba(255, 107, 0, 0.4);
      box-shadow: var(--shadow-focus), var(--shadow-lg);
    }

    .search-icon {
      padding-left: 20px;
      color: var(--color-text-muted);
      font-size: 24px;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 16px 16px;
      font-size: 1.125rem;
      font-family: var(--font-mono); /* Monospace for tracking numbers */
      color: var(--color-primary-dark);
      outline: none;
      text-transform: uppercase;
    }

    .search-input::placeholder {
      color: #9CA3AF;
      text-transform: none;
      font-family: var(--font-sans);
    }

    .search-button {
      background-color: var(--color-accent);
      color: var(--color-surface);
      border: none;
      border-radius: var(--radius-pill);
      padding: 0 32px;
      height: 54px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-fast);
    }

    .search-button:hover {
      background-color: var(--color-accent-hover);
      transform: translateY(-1px);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .search-button .spinner {
      display: none;
      animation: spin 1s linear infinite;
    }

    /* Loading State */
    .search-wrapper.is-loading .search-button {
      background-color: var(--color-text-muted);
      cursor: not-allowed;
      transform: none;
    }
    .search-wrapper.is-loading .button-text { display: none; }
    .search-wrapper.is-loading .search-button i { display: none; }
    .search-wrapper.is-loading .spinner { display: block; }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      color: var(--color-error);
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 12px;
      text-align: center;
      opacity: 0;
      transform: translateY(-5px);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .error-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Quick Links */
    .quick-links {
      margin-top: 32px;
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-link {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 0.875rem;
      color: var(--color-text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .quick-link:hover {
      border-color: var(--color-text-muted);
      color: var(--color-primary);
    }

    /* Footer / TrackSphere Watermark */
    .site-footer {
      padding: 32px 24px;
      text-align: center;
      margin-top: auto;
    }

    .powered-by {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #9CA3AF;
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .powered-by:hover {
      color: var(--color-text-muted);
    }

    .powered-by span {
      color: var(--color-primary);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .powered-by span i {
      color: var(--color-accent); /* Tiny orange accent in the brand name */
      font-style: normal;
    }

    /* ==========================================================================
       RESPONSIVE DESIGN
       ========================================================================== */
    @media (max-width: 640px) {
      .hero-title {
        font-size: 2rem;
      }
      .hero-subtitle {
        font-size: 1rem;
      }
      .search-wrapper {
        flex-direction: column;
        border-radius: var(--radius-card);
        padding: 12px;
      }
      .search-input {
        width: 100%;
        text-align: center;
        padding: 12px 0 20px 0;
      }
      .search-icon {
        display: none;
      }
      .search-button {
        width: 100%;
        justify-content: center;
        height: 48px;
      }
    }
  </style>
</head>
<body>

  <!-- Header: White-labeled for the Tenant -->
  <header class="site-header">
    <a href="#" class="tenant-brand">
      <div class="tenant-brand-icon">
        <i class="ph ph-globe-hemisphere-east"></i>
      </div>
      Apex Global
    </a>
    <div class="header-actions">
      <a href="#"><i class="ph ph-user-circle"></i> Client Portal</a>
    </div>
  </header>

  <!-- Main Content: The Tracking Search -->
  <main class="main-content">
    <div class="hero-text">
      <h1 class="hero-title">Track your shipment</h1>
      <p class="hero-subtitle">Enter your tracking, waybill, or reference number.</p>
    </div>

    <!-- The core form component -->
    <form id="trackingForm" style="width: 100%;">
      <div class="search-wrapper" id="searchWrapper">
        <div class="search-icon">
          <i class="ph ph-magnifying-glass"></i>
        </div>
        <input 
          type="text" 
          id="trackingInput" 
          class="search-input" 
          placeholder="e.g. TRK-4812-SH" 
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" class="search-button" id="searchBtn">
          <span class="button-text">Track</span>
          <i class="ph-bold ph-arrow-right"></i>
          <i class="ph-bold ph-spinner-gap spinner"></i>
        </button>
      </div>
      <div class="error-message" id="errorMessage">
        <i class="ph-fill ph-warning-circle"></i>
        <span>Please enter a valid tracking number.</span>
      </div>
    </form>

    <!-- Contextual Actions -->
    <div class="quick-links">
      <a href="#" class="quick-link">
        <i class="ph ph-file-text"></i>
        Track by Bill of Lading
      </a>
      <a href="#" class="quick-link">
        <i class="ph ph-headset"></i>
        Support
      </a>
    </div>
  </main>

  <!-- Footer: Platform Attribution -->
  <footer class="site-footer">
    <a href="https://tracksphere.io" target="_blank" class="powered-by">
      Powered by <span>Track<i>Sphere</i></span>
    </a>
  </footer>

  <!-- ==========================================================================
       INTERACTIVE LOGIC
       ========================================================================== */ -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('trackingForm');
      const input = document.getElementById('trackingInput');
      const wrapper = document.getElementById('searchWrapper');
      const errorMsg = document.getElementById('errorMessage');

      // Auto-focus input on page load for immediate friction-less interaction (desktop only to prevent mobile keyboard pop-up jumping)
      if (window.innerWidth > 768) {
        input.focus();
      }

      // Handle form submission
      form.addEventListener('submit', (e) => {
        e.preventDefault(); // Prevent standard page reload
        
        const trackingValue = input.value.trim().toUpperCase();

        // 1. Validation
        if (trackingValue.length < 5) {
          showError("Tracking number must be at least 5 characters long.");
          input.focus();
          return;
        }

        // 2. Hide error if previously shown
        hideError();

        // 3. Trigger UI Loading State
        wrapper.classList.add('is-loading');
        input.setAttribute('readonly', 'true'); // Prevent typing while loading

        // 4. Simulate Network/API Request (routing to tracking detail page)
        setTimeout(() => {
          // In a real production app, this would be:
          // window.location.href = `/track/${trackingValue}`;
          
          // For this prototype, we'll revert the UI and show an alert indicating successful routing.
          wrapper.classList.remove('is-loading');
          input.removeAttribute('readonly');
          
          // Success Feedback
          input.value = '';
          alert(`Success! Navigating to Shipment Detail Page for: ${trackingValue}\n\n(This is where App 1 connects to App 2)`);
        }, 1200); // 1.2s simulated delay
      });

      // Clear error message instantly when the user starts typing again
      input.addEventListener('input', () => {
        if (errorMsg.classList.contains('show')) {
          hideError();
        }
      });

      // Helper functions
      function showError(message) {
        errorMsg.querySelector('span').textContent = message;
        errorMsg.classList.add('show');
        // Add a slight shake animation to the wrapper for immediate physical feedback
        wrapper.style.transform = 'translateX(-5px)';
        setTimeout(() => wrapper.style.transform = 'translateX(5px)', 100);
        setTimeout(() => wrapper.style.transform = 'translateX(0)', 200);
      }

      function hideError() {
        errorMsg.classList.remove('show');
      }
    });
  </script>
</body>
</html>
